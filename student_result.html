<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Management System</title>

    <link rel="stylesheet" href="student_result.css">

</head>


<body>

    <div class="container">

        <!-- Application Header -->

        <h1>
            Student Result Management System
        </h1>

        <p class="subtitle">
            Manage and view student results
        </p>


        <!-- Add Student -->

        <div class="section">

            <h2 class="section-title">
                Add New Student
            </h2>


            <div class="form-group">

                <label for="rollNo">
                    Roll Number
                </label>

                <input type="text" id="rollNo" placeholder="Example: CST004">

            </div>


            <div class="form-group">

                <label for="name">
                    Student Name
                </label>

                <input type="text" id="name" placeholder="Enter student name">

            </div>


            <div class="form-group">

                <label for="mathematics">
                    Mathematics
                </label>

                <input type="number" id="mathematics" min="0" max="100" placeholder="Marks out of 100">

            </div>


            <div class="form-group">

                <label for="physics">
                    Physics
                </label>

                <input type="number" id="physics" min="0" max="100" placeholder="Marks out of 100">

            </div>


            <div class="form-group">

                <label for="programming">
                    Programming
                </label>

                <input type="number" id="programming" min="0" max="100" placeholder="Marks out of 100">

            </div>


            <div class="form-group">

                <label for="electronics">
                    Electronics
                </label>

                <input type="number" id="electronics" min="0" max="100" placeholder="Marks out of 100">

            </div>


            <button onclick="addStudent()">
                Add Student
            </button>


            <div id="addResult" class="result-area">
            </div>

        </div>


        <!-- Search Student -->

        <div class="section">

            <h2 class="section-title">
                Search Student
            </h2>


            <div class="form-group">

                <label for="searchRollNo">
                    Enter Roll Number
                </label>

                <input type="text" id="searchRollNo" placeholder="Example: CST001">

            </div>


            <button onclick="searchStudent()">
                Search Student
            </button>


            <div id="searchResult" class="result-area">
            </div>

        </div>


        <!-- View All Students -->

        <div class="section">

            <h2 class="section-title">
                All Students
            </h2>


            <button onclick="viewAllStudents()">
                View All Students
            </button>


            <div id="allStudentsResult" class="result-area">
            </div>

        </div>

    </div>


    <script src="student_result.js" defer></script>

</body>

</html>
